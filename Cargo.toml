[workspace]
resolver = "3"
members = ["crates/arin-core", "crates/arin-platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
arin-core = { path = "crates/arin-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

# リリースのプロファイルに panic = "abort" を書かない。
# 1 本のスレッドの異常でアプリ全体を落とさないため(NFR-006)。
