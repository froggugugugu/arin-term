[workspace]
resolver = "3"
members = ["crates/arin-core", "crates/arin-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
arin-core = { path = "crates/arin-core" }
arin-platform = { path = "crates/arin-platform" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Rust の型から TypeScript の型を生成する(ADR-006)。12.0.1 は 2026-01-31 公開。
# 既定の機能は serde の属性(rename_all など)を読む serde-compat だけ。日付やフォーマッタなどの機能は入れない。
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }
# Tauri の本体とビルド補助。npm 側の @tauri-apps/cli・@tauri-apps/api 2.12.4 と同じ系列。
# 機能は既定のまま。ネットワークに出られるプラグイン(HTTP、updater、shell など)は入れない(NFR-008)。
tauri = { version = "=2.12.5" }
tauri-build = { version = "=2.7.4" }
# PTY を開いてシェルを起動する(ADR-004)。使うのは arin-platform/src/pty/ だけ。0.9.0 は 2025-02 公開。
portable-pty = "=0.9.0"
# macOS のブックマーク(NSURL)を作って解決する(FR-007、設計書 §1.4 #12)。使うのは arin-platform/src/bookmark/ だけ。
# どちらも Tauri がすでに同じ版で使っているので、Cargo.lock に新しいクレートは増えない。
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSURL", "NSData", "NSError", "NSString", "NSArray"] }
# ブックマークのバイト列を state.json に入れる文字列に変える(標準の符号化)。Tauri が同じ版で使っている。
base64 = "=0.23.1"
# 開いたままにしたフォルダの現在のパスを fcntl の F_GETPATH で調べる(FR-007、設計書 §1.4 #13)。使うのは arin-platform/src/watch/ だけ。
# Tauri などがすでに同じ版で使っているので、Cargo.lock に新しいクレートは増えない。
libc = "=0.2.191"
# ペーストボードに文字列を書く(NSPasteboard。FR-064、設計書 §1.4 #19)。使うのは arin-platform/src/desktop/ だけ。
# Tauri がすでに同じ版・同じ feature で使っているので、Cargo.lock に新しいクレートは増えない。
# フォルダ選択のダイアログ(NSOpenPanel。FR-001・FR-007)の feature も、Tauri(wry)がすでに同じものを有効にしている(ADR-009)。
# tauri-plugin-dialog は tauri-plugin-fs を外せない依存に持つので使わない(設計書 §12)。
# M3(T40d): Finder で表示・既定のアプリで開く(NSWorkspace。FR-018)と、ファイルの URL のペーストボード
# (NSPasteboardItem。FR-027)の feature を足した。どちらも Tauri は有効にしていないが、版は同じで、
# 新しいクレートは増えない(NSWorkspace が objc2-foundation の feature を推移的に足すだけ。ADR-007 の追記)。
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication", "NSWorkspace"] }
# ツリーのファイル監視(FSEvents。FR-014、PRD C7、ADR-007)。使うのは arin-platform/src/watch/ だけ。
# 8.2.1 は 2026-10-25 公開(8.2.2 は 2026-11-08 公開で 2 週間未満のため避けた)。CC0-1.0。
# 既定の feature は macos_fsevent だけ。kqueue・crossbeam-channel などは入れない。
# 推移的な notify-types は Cargo.lock で 2.1.0(2026-01-25 公開)に止めている(2.3.0 は 2 週間未満)。
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }

# リリースのプロファイルに panic = "abort" を書かない。
# 1 本のスレッドの異常でアプリ全体を落とさないため(NFR-006)。
