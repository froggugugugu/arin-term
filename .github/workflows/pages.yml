name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages にサイトを出す(Jekyll)。紹介ページ(.github/pages/index.html。スクリプトを使わない 1 枚の静的なページ)を
# ルートに置き、README.md(→ README.html)・LICENSE・THIRD_PARTY_NOTICES.md・THIRD_PARTY_LICENSES.md・docs/media/ の画像・
# scripts/install.sh をその隣に置く。tadcap の pages.yml を移したもの。
# Pages はリポジトリの設定で一度だけ有効にする(Source: GitHub Actions)。GITHUB_TOKEN ではサイトを作れない。
# Action はコミットの SHA で固定する(版はコメント)。ランナーのイメージも固定する。
# Pages に書けるのは deploy だけ。build はリポジトリの中身を読む権限だけで Jekyll に通す。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read   # configure-pages がサイトの設定を読む
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: サイトの元を組み立てる
        run: |
          mkdir -p _pages/docs
          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md _pages/
          # jekyll-optional-front-matter は README.md を既定で描かない。front matter を付けると README.html になる。
          # README のリポジトリの中のファイルへのリンク(Markdown の [..](..))は、サイトには無いので GitHub の同じ場所へ向ける。
          # 画像(<img>・<picture> の HTML)と、http(s) と # のリンクはそのまま。
          { printf -- '---\ntitle: Arin の使い方\n---\n\n'
            perl -pe 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/froggugugugu/arin-term/blob/main/$1)}g' README.md
          } > _pages/README.md
          cp -R docs/media _pages/docs/media   # 紹介ページと README が使う画像
          cp .github/pages/_config.yml .github/pages/index.html _pages/
          cp scripts/install.sh _pages/   # https://froggugugugu.github.io/arin-term/install.sh で配る
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with: { source: ./_pages, destination: ./_site }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: ./_site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
